# ==============================================================================
# Docker Compose: GitHub Actions Runner (the portfolio)
# Description: Self-hosted GitHub Actions runner(s) for this repo's CI/CD.
#              The runner only needs the Docker
#              socket (to build/deploy) and outbound internet (to reach GitHub),
#              so it stays on the default bridge: no reverse-proxy network.
#
# Required Environment Variables:
#   - GITHUB_REPO_URL:     Full URL to the GitHub repository
#   - GITHUB_ACCESS_TOKEN: Personal Access Token with repo scope
#   - PROJECT:             Runner name prefix (default: portfolio)
#   - RUNNER_LABELS:       Comma-separated runner labels (default: docker,self-hosted)
#   - RUNNER_REPLICAS:     Number of runner instances (default: 1)
#
# Usage: docker compose -f docker-compose.github-runner.yml up -d
# ==============================================================================

services:
  runner:
    image: myoung34/github-runner:2.337.0
    restart: always

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    environment:
      # Registration
      - REPO_URL=${GITHUB_REPO_URL}
      - ACCESS_TOKEN=${GITHUB_ACCESS_TOKEN}

      # Naming and Labels
      - RUNNER_NAME_PREFIX=portfolio-runner
      - RUNNER_SCOPE=repo
      - LABELS=${RUNNER_LABELS:-docker,self-hosted}

      # Configuration
      - RUNNER_WORKDIR=/tmp/runner-work
      - DISABLE_AUTO_UPDATE=true

    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

    deploy:
      mode: replicated
      replicas: ${RUNNER_REPLICAS:-1}

      resources:
        limits:
          cpus: '2'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M

      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
