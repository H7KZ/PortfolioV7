# ==============================================================================
# Docker Compose: Monitoring (compose project portfolio-analytics)
# Description: Self-hosted Umami. The dashboard is umami.jankominek.com (behind
#              Cloudflare Access); the tracker and event endpoint are served
#              first-party at https://jankominek.com/stats/* so no third-party
#              host appears on the site. Only production is tracked.
#
# Required Environment Variables (from the private snapshot dotenv):
#   UMAMI_DB_NAME, UMAMI_DB_USER, UMAMI_DB_PASSWORD, UMAMI_APP_SECRET
#   SITE_DOMAIN (jankominek.com), UMAMI_DOMAIN (umami.jankominek.com)
# ==============================================================================

services:
  portfolio-umami-postgres:
    image: postgres:18.6-alpine
    container_name: portfolio-umami-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${UMAMI_DB_NAME}
      - POSTGRES_USER=${UMAMI_DB_USER}
      - POSTGRES_PASSWORD=${UMAMI_DB_PASSWORD}
    volumes:
      - portfolio-umami-postgres-volume:/var/lib/postgresql
    networks:
      - portfolio-analytics-internal-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 60s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 3s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 192M

  portfolio-umami:
    image: ghcr.io/umami-software/umami:3.4.0
    container_name: portfolio-umami
    restart: unless-stopped
    depends_on:
      portfolio-umami-postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${UMAMI_DB_USER}:${UMAMI_DB_PASSWORD}@portfolio-umami-postgres:5432/${UMAMI_DB_NAME}
      - APP_SECRET=${UMAMI_APP_SECRET}
      - TRACKER_SCRIPT_NAME=stats.js
      - DISABLE_TELEMETRY=1
      # Cloudflare -> Traefik -> umami: the visitor address is only in this header.
      - CLIENT_IP_HEADER=cf-connecting-ip
    networks:
      - portfolio-analytics-internal-network
      - public-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=public-network
      - traefik.http.routers.portfolio-umami.rule=Host(`${UMAMI_DOMAIN}`)
      - traefik.http.routers.portfolio-umami.entrypoints=websecure
      - traefik.http.routers.portfolio-umami.tls=true
      - traefik.http.routers.portfolio-umami.tls.certresolver=letsencrypt
      - traefik.http.routers.portfolio-umami.service=portfolio-umami
      - traefik.http.services.portfolio-umami.loadbalancer.server.port=3000
      # First-party tracker: /stats/stats.js and /stats/api/send on the site itself.
      # Above the web router (10) that catches every other path on the domain.
      - traefik.http.routers.portfolio-stats.rule=Host(`${SITE_DOMAIN}`) && PathPrefix(`/stats`)
      - traefik.http.routers.portfolio-stats.priority=210
      - traefik.http.routers.portfolio-stats.entrypoints=websecure
      - traefik.http.routers.portfolio-stats.tls=true
      - traefik.http.routers.portfolio-stats.tls.certresolver=letsencrypt
      - traefik.http.routers.portfolio-stats.service=portfolio-umami
      - traefik.http.routers.portfolio-stats.middlewares=portfolio-stats-strip
      - traefik.http.middlewares.portfolio-stats-strip.stripprefix.prefixes=/stats
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
