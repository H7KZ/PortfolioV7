# ==============================================================================
# Networks: Development (portfolio-dev)
#   public-network:                  shared Traefik network (Infrastructure's Traefik, or this
#                                    repository's deployment/ingress on a standalone host).
#   portfolio-dev-cms-network:       development web <-> development cms.
#   portfolio-dev-internal-network:  development cms <-> development postgres only.
# Development joins no production network.
# Toolkit creates portfolio-* networks; Infrastructure must provision public-network.
# ==============================================================================

networks:
  public-network:
    name: public-network
    external: true

  portfolio-dev-cms-network:
    name: portfolio-dev-cms-network
    external: true

  portfolio-dev-internal-network:
    name: portfolio-dev-internal-network
    external: true
