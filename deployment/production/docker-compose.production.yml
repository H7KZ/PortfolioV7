# ==============================================================================
# Docker Compose: Production Environment (portfolio)
# Description: jankominek.com (web), cms.jankominek.com (Payload) and the CMS
#              database. Application images use CI-provided digests; networks and
#              volumes live in networks.yml / volumes.yml and are merged at deploy.
#
# The CMS is global: development (dev.jankominek.com) reads it too, over
# portfolio-cms-network. cms.jankominek.com is protected by Cloudflare Access.
#
# Router names carry the ${PROJECT} suffix so production and development never
# collide on the one shared Infrastructure Traefik.
#
# Required Environment Variables (from the deploy-time .env):
#   WEB_IMAGE_REFERENCE, CMS_IMAGE_REFERENCE (full digest references)
#   PROJECT, DOMAIN, CMS_DOMAIN, UMAMI_WEBSITE_ID (optional)
#   POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD
#   PAYLOAD_SECRET, PREVIEW_SECRET, REVALIDATE_SECRET (same value in development)
#   CMS_READ_API_KEY, CMS_CONTACT_API_KEY, DISCORD_WEBHOOK_URL (optional)
# ==============================================================================

services:
  portfolio-web:
    image: ${WEB_IMAGE_REFERENCE:?A web digest reference is required}
    container_name: portfolio-web-prod
    restart: unless-stopped
    environment:
      - NUXT_CMS_INTERNAL_URL=http://portfolio-cms:3000
      - NUXT_CMS_READ_API_KEY=${CMS_READ_API_KEY}
      - NUXT_CMS_CONTACT_API_KEY=${CMS_CONTACT_API_KEY}
      - NUXT_PREVIEW_SECRET=${PREVIEW_SECRET}
      - NUXT_REVALIDATE_SECRET=${REVALIDATE_SECRET}
      - NUXT_PUBLIC_SITE_URL=https://${DOMAIN}
      - NUXT_PUBLIC_I18N_BASE_URL=https://${DOMAIN}
      - NUXT_PUBLIC_UMAMI_WEBSITE_ID=${UMAMI_WEBSITE_ID:-}
    networks:
      - public-network
      - portfolio-cms-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=public-network
      - traefik.http.routers.portfolio-web-${PROJECT}.rule=Host(`${DOMAIN}`)
      # Below the analytics stack's /stats router (210).
      - traefik.http.routers.portfolio-web-${PROJECT}.priority=10
      - traefik.http.routers.portfolio-web-${PROJECT}.entrypoints=websecure
      - traefik.http.routers.portfolio-web-${PROJECT}.tls=true
      - traefik.http.routers.portfolio-web-${PROJECT}.tls.certresolver=letsencrypt
      - traefik.http.routers.portfolio-web-${PROJECT}.service=portfolio-web-${PROJECT}
      - traefik.http.services.portfolio-web-${PROJECT}.loadbalancer.server.port=3000
    healthcheck:
      # 127.0.0.1, not localhost: localhost resolves to ::1 first in Alpine.
      test: ['CMD', 'wget', '-qO', '/dev/null', 'http://127.0.0.1:3000/robots.txt']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
      start_interval: 3s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M

  portfolio-cms:
    image: ${CMS_IMAGE_REFERENCE:?A CMS digest reference is required}
    container_name: portfolio-cms
    restart: unless-stopped
    depends_on:
      portfolio-postgres:
        condition: service_healthy
    environment:
      - DATABASE_URI=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@portfolio-postgres:5432/${POSTGRES_DB}
      - PAYLOAD_SECRET=${PAYLOAD_SECRET}
      - CMS_URL=https://${CMS_DOMAIN}
      - SITE_URL=https://${DOMAIN}
      - PREVIEW_SECRET=${PREVIEW_SECRET}
      - REVALIDATE_SECRET=${REVALIDATE_SECRET}
      # Every web that caches CMS content. A missing development container only logs a warning.
      - REVALIDATE_URLS=http://portfolio-web-prod:3000/_internal/revalidate,http://portfolio-web-dev:3000/_internal/revalidate
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - MEDIA_DIR=/data/media
    volumes:
      - portfolio-uploads-volume:/data/media
    networks:
      - public-network
      - portfolio-cms-network
      - portfolio-internal-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=public-network
      - traefik.http.routers.portfolio-cms-${PROJECT}.rule=Host(`${CMS_DOMAIN}`)
      - traefik.http.routers.portfolio-cms-${PROJECT}.entrypoints=websecure
      - traefik.http.routers.portfolio-cms-${PROJECT}.tls=true
      - traefik.http.routers.portfolio-cms-${PROJECT}.tls.certresolver=letsencrypt
      - traefik.http.routers.portfolio-cms-${PROJECT}.service=portfolio-cms-${PROJECT}
      - traefik.http.services.portfolio-cms-${PROJECT}.loadbalancer.server.port=3000
    healthcheck:
      test: ['CMD', 'wget', '-qO', '/dev/null', 'http://127.0.0.1:3000/api/users/me']
      interval: 60s
      timeout: 10s
      retries: 3
      # First boot runs migrations.
      start_period: 120s
      start_interval: 5s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 768M

  portfolio-postgres:
    image: postgres:18.6-alpine
    container_name: portfolio-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - portfolio-postgres-volume:/var/lib/postgresql
    networks:
      - portfolio-internal-network
    oom_score_adj: -500
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 60s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 3s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
