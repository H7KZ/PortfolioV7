# ==============================================================================
# Networks: Production (portfolio)
#   public-network:              Infrastructure's shared Traefik network.
#   portfolio-cms-network:       web (both environments) <-> cms. Shared by both
#                                stacks, so it is external to both.
#   portfolio-internal-network:  cms <-> postgres only.
# Toolkit creates portfolio-* networks; Infrastructure must provision public-network.
# ==============================================================================

networks:
  public-network:
    name: public-network
    external: true

  portfolio-cms-network:
    name: portfolio-cms-network
    external: true

  portfolio-internal-network:
    name: portfolio-internal-network
    external: true
