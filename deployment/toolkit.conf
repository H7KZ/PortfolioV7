# Toolkit integration for this repository (format: https://github.com/H7KZ/Toolkit/tree/main/docs/consumers.md).
REPOSITORY=portfolio
# <environment>:<snapshot root below the deploy user's home>; target name = last path segment
RELEASE_TARGETS=production:portfolio/versions/production development:portfolio/versions/development monitoring:portfolio/versions/monitoring
BACKUP_COMPONENTS=deployment/backup/components.sh
BACKUP_4H_AT=*-*-* 00/4:45:00 UTC
BACKUP_DAILY_AT=*-*-* 01:45:00 UTC
JOBS=umami-retention
JOB_UMAMI_RETENTION_RUN=deployment/analytics/retention.sh
JOB_UMAMI_RETENTION_AT=*-*-* 02:17:00 UTC
JOB_UMAMI_RETENTION_ENVIRONMENT=monitoring
