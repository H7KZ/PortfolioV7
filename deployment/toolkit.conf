# Toolkit integration for this repository (format: https://github.com/H7KZ/Toolkit/tree/main/docs/consumers.md).
REPOSITORY=portfolio
# <environment>:<snapshot root below the deploy user's home>; target name = last path segment.
# `ingress` is this repository's own Traefik for a standalone server and is never deployed on a
# shared host (docs/runbooks/split-to-own-server.md). Toolkit 0.11 has no `ingress` lock
# environment yet, so its target uses `infrastructure`; switch it when a release adds `ingress`.
# Monitoring and Umami are shared per host and owned by Infrastructure.
RELEASE_TARGETS=production:portfolio/versions/production development:portfolio/versions/development infrastructure:portfolio/versions/ingress
# Backups: every component every 4 h (UTC, :45 per the host-wide stagger). Host Sync enables the timer
# after one successful run; settings come from GitHub secrets.
BACKUP_COMPONENTS=deployment/backup/components.sh
BACKUP_AT=*-*-* 00/4:45:00 UTC

# Host-wide singletons: declare each in exactly one repository per host. They stay commented out
# while Infrastructure owns the host. To enable them on a standalone server that runs this
# repository's ingress, uncomment, then `sudo deployment/toolkit install --deploy-user deploy`
# and enable the printed units (docs/runbooks/split-to-own-server.md).
# Host package updates, Sunday 03:30 UTC:
# MAINTENANCE_AT=Sun *-*-* 03:30:00 UTC
# Cloudflare-only origin firewall, re-applied at boot before containers are reconciled:
# RECONCILE_BEFORE=deployment/ingress/cloudflare-firewall.sh
# ...and refreshed weekly (also add `JOBS=cloudflare-firewall`):
# JOB_CLOUDFLARE_FIREWALL_RUN=deployment/ingress/cloudflare-firewall.sh
# JOB_CLOUDFLARE_FIREWALL_AT=Mon *-*-* 04:00:00 UTC
# JOB_CLOUDFLARE_FIREWALL_ENVIRONMENT=infrastructure
# JOB_CLOUDFLARE_FIREWALL_HOST_WINDOW=true
