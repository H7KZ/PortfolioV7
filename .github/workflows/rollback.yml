name: Rollback Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Whole snapshot to restore
        type: choice
        options: [production, development, monitoring]
        default: development
      release_id:
        description: previous or an existing fullSHA-run-attempt snapshot ID
        required: true
        type: string
        default: previous

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  rollback:
    uses: ./.github/workflows/_deploy-service.yml
    with:
      operation: rollback
      environment: ${{ inputs.environment }}
      release_id: ${{ inputs.release_id }}
    secrets: inherit
