# ==============================================================================
# Workflow: Rollback Deployment
# Description: Redeploys a previously deployed SHA for one or both services.
#              A guard check ensures the target version directory exists on
#              the server before any deploy job runs.
#
#              The CMS exists ONLY in production, so:
#                - service: cms with environment: development is rejected.
#                - service: all with environment: development rolls back web
#                  only (cms is silently skipped, not rejected).
#
# Trigger: manual (workflow_dispatch) only
# ==============================================================================

name: Rollback Deployment

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Short SHA to roll back to (8 hex chars, e.g. a1b2c3d4)'
        required: true
        type: string
      service:
        description: 'Service to roll back'
        required: true
        type: choice
        options:
          - web
          - cms
          - all
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - production
          - development
        default: production

permissions:
  contents: read
  packages: read

# Same concurrency group as Deploy so a rollback and a manual deploy cannot run
# at the same time and stomp on each other.
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate - version ${{ inputs.sha }} exists on server
    runs-on: self-hosted
    timeout-minutes: 5
    environment: ${{ inputs.environment }}
    steps:
      - name: Reject CMS rollback targeting development
        run: |
          if [[ "${{ inputs.service }}" == "cms" && "${{ inputs.environment }}" == "development" ]]; then
            echo "ERROR: the CMS exists only in production. Choose service: web (or all, which rolls back web only in development)."
            exit 1
          fi

      - name: Check version directory exists
        uses: appleboy/ssh-action@v1
        env:
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_ENV: ${{ inputs.environment }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: INPUT_SHA,INPUT_ENV
          script: |
            set -euo pipefail
            if [[ ! "$INPUT_SHA" =~ ^[0-9a-f]{8}$ ]]; then
              echo "ERROR: sha must be exactly 8 lowercase hex characters, got: '$INPUT_SHA'"
              exit 1
            fi
            VERSION_DIR="$HOME/portfolio/versions/$INPUT_ENV/$INPUT_SHA"
            if [[ ! -d "$VERSION_DIR" ]]; then
              echo "ERROR: Version $INPUT_SHA not found on server."
              echo "Available versions:"
              ls "$HOME/portfolio/versions/$INPUT_ENV/" 2>/dev/null | grep -v '^current$' || echo "  (none)"
              exit 1
            fi
            echo "OK: $VERSION_DIR exists - proceeding with rollback."

  resolve:
    name: Resolve Deploy Variables
    runs-on: self-hosted
    timeout-minutes: 5
    needs: [validate]
    outputs:
      image_prefix: ${{ steps.vars.outputs.image_prefix }}
      project_name: ${{ steps.vars.outputs.project_name }}
    steps:
      - name: Compute variables
        id: vars
        run: |
          REPO="${{ github.repository }}"
          echo "image_prefix=${REPO,,}" >> "$GITHUB_OUTPUT"
          if [[ "${{ inputs.environment }}" == "production" ]]; then
            echo "project_name=portfolio" >> "$GITHUB_OUTPUT"
          else
            echo "project_name=portfolio-dev" >> "$GITHUB_OUTPUT"
          fi

  # Deploy jobs run in parallel - each only fires for the selected service.
  deploy-web:
    name: Rollback Web to ${{ inputs.sha }}
    needs: [resolve]
    if: >-
      always() &&
      needs.resolve.result == 'success' &&
      (inputs.service == 'web' || inputs.service == 'all')
    uses: ./.github/workflows/_deploy-service.yml
    with:
      service: web
      environment: ${{ inputs.environment }}
      project_name: ${{ needs.resolve.outputs.project_name }}
      image_tag: ${{ inputs.sha }}
      image_prefix: ${{ needs.resolve.outputs.image_prefix }}
    secrets: inherit

  deploy-cms:
    name: Rollback CMS to ${{ inputs.sha }}
    needs: [resolve]
    # 'all' only ever means "web" in development - the CMS never deploys
    # there, so this job only fires for production regardless of how 'all'
    # is selected. A bare service: cms + environment: development request
    # is already rejected in the validate job above.
    if: >-
      always() &&
      needs.resolve.result == 'success' &&
      (inputs.service == 'cms' || inputs.service == 'all') &&
      inputs.environment == 'production'
    uses: ./.github/workflows/_deploy-service.yml
    with:
      service: cms
      environment: ${{ inputs.environment }}
      project_name: ${{ needs.resolve.outputs.project_name }}
      image_tag: ${{ inputs.sha }}
      image_prefix: ${{ needs.resolve.outputs.image_prefix }}
    secrets: inherit
