name: Restore Release
run-name: 'Restore Release · ${{ inputs.environment }} · ${{ inputs.ref || github.ref_name }} · ${{ inputs.operation }}'

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Toolkit source branch, tag or SHA; blank = workflow ref
        type: string
        default: ''
      operation:
        description: Restore a release, activate a staged release, or reconcile current
        type: choice
        options: [rollback, activate, reconcile]
        default: rollback
      environment:
        description: Whole snapshot to restore
        type: choice
        options: [production, development, monitoring]
        default: development
      release_id:
        description: current, previous or fullSHA-run-attempt; ignored for reconcile
        required: true
        type: string
        default: previous

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  source:
    name: Resolve source
    uses: ./.github/workflows/_resolve.yml
    with:
      ref: ${{ inputs.ref }}
  rollback:
    name: Restore release
    needs: source
    uses: ./.github/workflows/_deploy.yml
    with:
      operation: ${{ inputs.operation }}
      source_commit: ${{ needs.source.outputs.sha }}
      environment: ${{ inputs.environment }}
      release_id: ${{ inputs.release_id }}
    secrets: inherit
