# Retention-based deletion of old container image versions in GHCR. Keeps the newest KEEP_NEWEST
# tagged versions per package, any version tagged latest/prod/current/*-latest, and any digest
# listed in the protected_digests input. Untagged versions (attestations, child manifests) are
# never deleted.
#
# Every digest a release retained on the VPS references (current, previous and the newest
# snapshots the toolkit keeps) is read over SSH and protected; if that read fails, nothing is
# deleted. Scheduled runs delete; a manual dispatch is a dry run unless dry_run is unticked.

name: Cleanup Registry
run-name: "Cleanup Registry · ${{ (github.event_name == 'schedule' || !inputs.dry_run) && 'delete' || 'preview' }}"

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      keep_newest:
        description: Newest tagged versions to keep per package (minimum 1)
        required: true
        type: number
        default: 6
      min_age_days:
        description: Minimum version age before deletion, in days
        required: true
        type: number
        default: 7
      packages:
        description: Packages, space or comma separated; blank = portfoliov7/web and portfoliov7/cms
        required: false
        type: string
        default: ''
      dry_run:
        description: Only log what would be deleted
        required: true
        type: boolean
        default: true
      protected_digests:
        description: 'Digests to keep (sha256:..., space, comma or newline separated): deployed, previous, rollback'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: registry-cleanup
  cancel-in-progress: false

jobs:
  deployed:
    name: Read retained release digests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      digests: ${{ steps.digests.outputs.digests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify toolkit pin
        run: bash deployment/toolkit verify
      - name: List digests of retained releases on the VPS
        id: read
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          command_timeout: 2m
          capture_stdout: true
          script: |
            set -euo pipefail
            python3 - <<'PY'
            import glob, json, os
            seen = set()
            for path in glob.glob(os.path.expanduser("~/portfolio/versions/*/*/image-digests.json")):
                with open(path, encoding="utf-8") as handle:
                    seen.update(json.load(handle)["services"].values())
            print("DIGESTS " + " ".join(sorted(seen)))
            PY
      - name: Validate digests
        id: digests
        env:
          STDOUT: ${{ steps.read.outputs.stdout }}
        run: |
          set -euo pipefail
          line="$(grep '^DIGESTS ' <<<"$STDOUT" | tail -1)"
          digests="${line#DIGESTS }"
          for digest in $digests; do
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::unexpected digest $digest"; exit 1; }
          done
          [[ -n "$digests" ]] || echo '::warning::no retained releases found on the VPS'
          echo "digests=$digests" >>"$GITHUB_OUTPUT"
          echo "Protected from the VPS: ${digests:-none}" >>"$GITHUB_STEP_SUMMARY"
  cleanup:
    needs: deployed
    name: Cleanup ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        package:
          - portfoliov7/web
          - portfoliov7/cms
    steps:
      - name: Prune old versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: ${{ matrix.package }}
          OWNER: ${{ github.repository_owner }}
          DRY_RUN: ${{ (github.event_name == 'schedule' || inputs.dry_run == false) && 'false' || 'true' }}
          PROTECTED: ${{ format('{0} {1}', inputs.protected_digests, needs.deployed.outputs.digests) }}
          SELECTED_PACKAGES: ${{ inputs.packages }}
          KEEP_NEWEST: ${{ github.event_name == 'workflow_dispatch' && toJSON(inputs.keep_newest) || '6' }}
          MIN_AGE_DAYS: ${{ github.event_name == 'workflow_dispatch' && toJSON(inputs.min_age_days) || '7' }}
        run: |
          set -euo pipefail
          [[ "$KEEP_NEWEST" =~ ^[1-9][0-9]{0,5}$ ]] || { echo 'keep_newest must be an integer from 1 to 999999' >&2; exit 1; }
          [[ "$MIN_AGE_DAYS" =~ ^(0|[1-9][0-9]{0,4})$ ]] || { echo 'min_age_days must be an integer from 0 to 99999' >&2; exit 1; }
          selected="${SELECTED_PACKAGES//,/ }"
          protected_tokens="${PROTECTED//,/ }"
          for selected_package in $selected; do
            case "$selected_package" in portfoliov7/web|portfoliov7/cms) ;; *) echo 'Unknown package' >&2; exit 1 ;; esac
          done
          for digest in $protected_tokens; do
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo 'protected_digests requires complete sha256 digests' >&2; exit 1; }
          done
          if [[ -n "$selected" ]]; then
            found=false
            for selected_package in $selected; do
              [[ "$selected_package" != "$PACKAGE" ]] || found=true
            done
            [[ "$found" == true ]] || { echo "Skip $PACKAGE"; exit 0; }
          fi
          enc="${PACKAGE//\//%2F}"
          base="users/${OWNER}/packages/container/${enc}/versions"
          gh api --paginate "${base}?per_page=100" --jq '.[]' | jq -s 'sort_by(.created_at) | reverse' > versions.json
          total="$(jq 'length' versions.json)"
          untagged="$(jq '[.[] | select((.metadata.container.tags // []) | length == 0)] | length' versions.json)"
          echo "::notice::${PACKAGE}: ${total} versions (${untagged} untagged, never deleted); keep newest ${KEEP_NEWEST}; dry_run=${DRY_RUN}"
          jq -r --argjson keep "$KEEP_NEWEST" --argjson age "$MIN_AGE_DAYS" --arg prot "$PROTECTED" '
            ([$prot | scan("sha256:[0-9a-f]+")]) as $p
            | [.[] | select((.metadata.container.tags // []) | length > 0)]
            | to_entries[]
            | .key as $i | .value as $v | ($v.metadata.container.tags) as $t
            | (if $i < $keep then "keep-newest"
               elif ($t | any(test("^(latest|prod|current)$") or test("-latest$"))) then "keep-tag"
               elif ($p | index($v.name)) then "keep-protected"
               elif ($v.created_at | fromdateiso8601) > (now - $age * 86400) then "keep-recent"
               else "delete" end) as $a
            | [$a, ($v.id | tostring), $v.name, ($t | join(",")), $v.created_at] | @tsv
          ' versions.json > plan.tsv
          cat plan.tsv
          del=0
          while IFS=$'\t' read -r action id digest tags created; do
            [ "$action" = delete ] || continue
            del=$((del + 1))
            if [ "$DRY_RUN" = true ]; then
              echo "DRY-RUN would delete id=${id} ${digest} tags=${tags} created=${created}"
            else
              echo "Deleting id=${id} ${digest} tags=${tags} created=${created}"
              gh api -X DELETE "${base}/${id}"
            fi
          done < plan.tsv
          echo "### ${PACKAGE}: ${del} to delete (dry_run=${DRY_RUN})" >> "$GITHUB_STEP_SUMMARY"
