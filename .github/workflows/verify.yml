# ==============================================================================
# Workflow: Verify
# Description: Type-check, lint, and format-check the whole monorepo. No tests
#              step - this repo has none yet. Runs on GitHub-hosted runners.
# Trigger: pull_request targeting main, or called by Deploy before image builds
# ==============================================================================

name: Verify Code

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      ref:
        description: Source branch, tag or SHA; blank = workflow ref
        type: string
        default: ''

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check
