name: Deploy Environment (reusable)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      operation:
        type: string
        default: deploy
      web_digest:
        type: string
        default: ''
      cms_digest:
        type: string
        default: ''
      release_id:
        type: string
        default: previous

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - name: Validate release request and pin
        id: meta
        env:
          TARGET: ${{ inputs.environment }}
          OPERATION: ${{ inputs.operation }}
          RESTORE_ID: ${{ inputs.release_id }}
          HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          case "$TARGET" in production|development|monitoring) ;; *) exit 1 ;; esac
          case "$OPERATION" in deploy|rollback) ;; *) exit 1 ;; esac
          [[ "$TARGET" == development || "$GITHUB_REF" == refs/heads/main ]] || {
            echo 'Production and analytics require main.' >&2; exit 1;
          }
          [[ "$HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]+={0,2}$ ]] || {
            echo 'SSH_HOST_FINGERPRINT must pin the verified server key.' >&2; exit 1;
          }
          [[ "$RESTORE_ID" == previous || "$RESTORE_ID" =~ ^[a-f0-9]{40}-[0-9]+-[0-9]+$ ]] || exit 1
          bash deployment/verify-toolkit-pin.sh
          version="$(awk -F= '$1 == "TOOLKIT_VERSION" {print $2}' deployment/toolkit.lock)"
          [[ "$version" =~ ^0\.[0-9]+\.[0-9]+$ && "$(printf '%s\n' 0.8.1 "$version" | sort -V | head -1)" == 0.8.1 ]] || { echo 'Toolkit snapshot API requires >=0.8.1, <1.0.0.' >&2; exit 1; }
          echo "toolkit_version=$version" >> "$GITHUB_OUTPUT"
          echo "release_id=$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Prepare archive, manifest and private environment
        if: inputs.operation == 'deploy'
        env:
          WEB_DIGEST: ${{ inputs.web_digest }}
          CMS_DIGEST: ${{ inputs.cms_digest }}
          PROJECT: ${{ vars.PROJECT }}
          DOMAIN: ${{ vars.DOMAIN }}
          CMS_DOMAIN: ${{ vars.CMS_DOMAIN }}
          UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          PREVIEW_SECRET: ${{ secrets.PREVIEW_SECRET }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          CMS_READ_API_KEY: ${{ secrets.CMS_READ_API_KEY }}
          CMS_CONTACT_API_KEY: ${{ secrets.CMS_CONTACT_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          UMAMI_DOMAIN: ${{ vars.UMAMI_DOMAIN }}
          UMAMI_DB_NAME: ${{ secrets.UMAMI_DB_NAME }}
          UMAMI_DB_USER: ${{ secrets.UMAMI_DB_USER }}
          UMAMI_DB_PASSWORD: ${{ secrets.UMAMI_DB_PASSWORD }}
          UMAMI_APP_SECRET: ${{ secrets.UMAMI_APP_SECRET }}
          TARGET: ${{ inputs.environment }}
        run: python3 deployment/prepare-release.py "$TARGET" "$GITHUB_WORKSPACE/bundle"
      - name: Prepare repository toolkit packet
        run: |
          mkdir -p bundle
          version="$(sed -n 's/^TOOLKIT_VERSION=//p' deployment/toolkit.lock)"
          cp "deployment/vendor/toolkit/toolkit-$version.tar.gz" "$PWD/bundle/toolkit.tar.gz"
          cp "deployment/toolkit.lock" "$PWD/bundle/toolkit.lock"
          printf '%s  toolkit.tar.gz\n' "$(sed -n 's/^TOOLKIT_ARCHIVE_SHA256=//p' deployment/toolkit.lock)" > "$PWD/bundle/toolkit.tar.gz.sha256"
      - name: Host preflight
        uses: appleboy/ssh-action@v1
        env:
          TOOLKIT_VERSION: ${{ steps.meta.outputs.toolkit_version }}
          RELEASE_ID: ${{ steps.meta.outputs.release_id }}
          OPERATION: ${{ inputs.operation }}
          TARGET: ${{ inputs.environment }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          envs: TOOLKIT_VERSION,RELEASE_ID,OPERATION,TARGET
          script: |
            set -euo pipefail
            [[ -x /usr/local/libexec/toolkit-run-bundle ]] || { echo 'Install CI bundle runner first (deployment/install-toolkit.sh --ci-only --deploy-user <account>)' >&2; exit 1; }
            umask 077
            case "$TARGET" in production|development|monitoring) ;; *) exit 1 ;; esac
            install -d -m 0700 "$HOME/portfolio/versions/$TARGET"
            mkdir -p "$HOME/portfolio/incoming"
            chmod 700 "$HOME/portfolio/incoming"
            mkdir -m 700 "$HOME/portfolio/incoming/$RELEASE_ID"
      - name: Upload private release inputs
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          source: bundle/*
          target: ~/portfolio/incoming/${{ steps.meta.outputs.release_id }}
          strip_components: 1
      - name: Apply exact release through toolkit
        uses: appleboy/ssh-action@v1
        env:
          TARGET: ${{ inputs.environment }}
          OPERATION: ${{ inputs.operation }}
          RESTORE_ID: ${{ inputs.release_id }}
          RELEASE_ID: ${{ steps.meta.outputs.release_id }}
          TOOLKIT_VERSION: ${{ steps.meta.outputs.toolkit_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          envs: TARGET,OPERATION,RESTORE_ID,RELEASE_ID,TOOLKIT_VERSION,GH_TOKEN,GH_ACTOR
          command_timeout: 110m
          script: |
            set -euo pipefail
            case "$TARGET" in production|development|monitoring) ;; *) exit 1 ;; esac
            [[ "$RELEASE_ID" =~ ^[a-f0-9]{40}-[0-9]+-[0-9]+$ ]] || exit 1
            [[ "$RESTORE_ID" == previous || "$RESTORE_ID" =~ ^[a-f0-9]{40}-[0-9]+-[0-9]+$ ]] || exit 1
            umask 077
            incoming="$HOME/portfolio/incoming/$RELEASE_ID"
            registry="$(mktemp -d "$HOME/portfolio/.registry.XXXXXXXX")"
            cleanup() {
              rm -rf -- "$registry"
              rm -rf -- "$incoming"
            }
            trap cleanup EXIT
            printf '%s' "$GH_TOKEN" | docker --config "$registry" login ghcr.io -u "$GH_ACTOR" --password-stdin >/dev/null
            args=(--repository portfolio --environment "$TARGET"
              --root "$HOME/portfolio/versions/$TARGET" --user "$(id -un)" --registry-config "$registry")
            case "$OPERATION" in
              deploy)
                chmod 600 "$incoming/release.env"
                sudo -n /usr/local/libexec/toolkit-run-bundle --archive "$incoming/toolkit.tar.gz" --checksum "$incoming/toolkit.tar.gz.sha256" --lock "$incoming/toolkit.lock" -- release deploy "${args[@]}" \
                  --archive "$incoming/release.tar.gz" --checksum "$incoming/release.tar.gz.sha256" \
                  --manifest "$incoming/manifest.json" --env-file "$incoming/release.env"
                ;;
              rollback)
                sudo -n /usr/local/libexec/toolkit-run-bundle --archive "$incoming/toolkit.tar.gz" --checksum "$incoming/toolkit.tar.gz.sha256" --lock "$incoming/toolkit.lock" -- release rollback "${args[@]}" --release-id "$RESTORE_ID"
                ;;
              *) exit 1 ;;
            esac
      - name: Remove private inputs
        if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/bundle"
      - name: Remove remote incoming inputs
        if: always() && steps.meta.outcome == 'success'
        uses: appleboy/ssh-action@v1
        env:
          RELEASE_ID: ${{ steps.meta.outputs.release_id }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          envs: RELEASE_ID
          script: |
            set -euo pipefail
            [[ "$RELEASE_ID" =~ ^[a-f0-9]{40}-[0-9]+-[0-9]+$ ]] || exit 1
            rm -rf -- "$HOME/portfolio/incoming/$RELEASE_ID"
