# Deploys this repository's own analytics stack (self-hosted Umami and its Postgres, deployment/monitoring)
# as an immutable toolkit release. Host Sync runs first. Monitoring is not shared with the other
# repositories on the host. Runs only from main, like production.

name: Deploy Monitoring
run-name: 'Deploy Monitoring · monitoring · ${{ inputs.ref || github.ref_name }} · ${{ inputs.operation }}'

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Source branch, tag or SHA; blank = workflow ref
        required: false
        type: string
        default: ''
      operation:
        description: Deploy now or stage a release for later activation
        required: true
        type: choice
        options: [deploy, stage]
        default: deploy

permissions:
  contents: read

concurrency:
  group: deploy-monitoring
  cancel-in-progress: false

jobs:
  source:
    name: Resolve source
    uses: ./.github/workflows/_resolve.yml
    with:
      ref: ${{ inputs.ref }}

  host-sync:
    name: Sync host
    needs: source
    permissions:
      contents: read
    uses: ./.github/workflows/host-sync.yml
    with:
      ref: ${{ needs.source.outputs.sha }}
    secrets: inherit

  deploy:
    name: Deploy release
    needs: [source, host-sync]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: monitoring
      source_commit: ${{ needs.source.outputs.sha }}
      version: ${{ needs.source.outputs.version }}
      operation: ${{ inputs.operation }}
    secrets: inherit
