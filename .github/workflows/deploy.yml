# Verifies, builds or reuses images, and deploys development or production as an immutable toolkit
# release. Every push to main deploys development; manual development runs pick any source ref, while
# production and ingress run only from main and only for a commit on main.
# Not supported here (the repo has no qualified-development promotion): modes `promote`, input `run_id`.

name: Deploy
run-name: "Deploy · ${{ inputs.environment || 'development' }} · ${{ inputs.ref || github.ref_name }} · ${{ inputs.operation || 'deploy' }}"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (production includes the CMS)
        required: true
        type: choice
        options: [development, production]
        default: development
      ref:
        description: Source branch, tag or SHA; blank = workflow ref
        required: false
        type: string
        default: ''
      operation:
        description: Deploy now or stage a release for later activation
        required: true
        type: choice
        options: [deploy, stage]
        default: deploy
      mode:
        description: Reuse images and build missing ones, always build, or require existing images
        required: true
        type: choice
        options: [reuse, build, existing]
        default: reuse
      image_tag:
        description: Existing image tag for reuse or existing mode; blank = environment-sourceSHA
        required: false
        type: string
        default: ''
      digests:
        description: 'Existing mode only: complete digest JSON {"web":"sha256:...","cms":"sha256:..."}; development needs web only'
        required: false
        type: string
        default: ''
      verify:
        description: Verify the selected source before deployment
        required: true
        type: boolean
        default: true
      no_cache:
        description: Build without the Docker layer cache
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment || 'development' }}
  cancel-in-progress: false

jobs:
  source:
    name: Resolve source
    uses: ./.github/workflows/_resolve.yml
    with:
      ref: ${{ inputs.ref }}

  verify:
    name: Verify code
    needs: source
    if: github.event_name != 'workflow_dispatch' || inputs.verify
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ needs.source.outputs.sha }}

  resolve-images:
    name: Resolve images
    needs: [source, verify]
    if: >-
      !cancelled() && needs.source.result == 'success' &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      web_digest: ${{ steps.images.outputs.web_digest }}
      cms_digest: ${{ steps.images.outputs.cms_digest }}
    steps:
      - name: Resolve complete image set
        id: images
        env:
          TARGET: ${{ inputs.environment || 'development' }}
          MODE: ${{ inputs.mode || 'build' }}
          OPERATION: ${{ inputs.operation || 'deploy' }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          NO_CACHE: ${{ inputs.no_cache || false }}
          DIGESTS: ${{ inputs.digests }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          case "$TARGET" in production|development) ;; *) exit 1 ;; esac
          case "$MODE" in build|reuse|existing) ;; *) exit 1 ;; esac
          case "$OPERATION" in deploy|stage) ;; *) exit 1 ;; esac
          services='["web"]'
          [[ "$TARGET" != production ]] || services='["web","cms"]'
          [[ -z "$DIGESTS" || "$MODE" == existing ]] || { echo 'digests requires existing mode' >&2; exit 1; }
          [[ -z "$DIGESTS" || -z "$IMAGE_TAG" ]] || { echo 'Choose digests or image_tag' >&2; exit 1; }
          [[ -z "$IMAGE_TAG" || "$MODE" != build ]] || { echo 'image_tag requires reuse or existing mode' >&2; exit 1; }
          [[ "$NO_CACHE" != true || "$MODE" != existing ]] || { echo 'no_cache requires build or reuse mode' >&2; exit 1; }
          if [[ -n "$DIGESTS" ]]; then
            jq -e --argjson services "$services" 'type == "object" and (keys | sort) == ($services | sort) and all(.[]; type == "string" and test("^sha256:[a-f0-9]{64}$"))' <<< "$DIGESTS" >/dev/null
          fi
          tag="${IMAGE_TAG:-$TARGET-$SOURCE_SHA}"
          [[ "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || { echo 'Invalid image_tag' >&2; exit 1; }
          [[ "$MODE" != build ]] || exit 0
          prefix="$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin >/dev/null
          trap 'docker logout ghcr.io >/dev/null' EXIT
          while IFS= read -r service; do
            if [[ -n "$DIGESTS" ]]; then
              digest="$(jq -r --arg service "$service" '.[$service]' <<< "$DIGESTS")"
              docker buildx imagetools inspect "ghcr.io/$prefix/$service@$digest" >/dev/null
            else
              digest="$(docker buildx imagetools inspect "ghcr.io/$prefix/$service:$tag" --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest // empty' || true)"
            fi
            if [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "${service}_digest=$digest" >> "$GITHUB_OUTPUT"
              echo "Reuse $service@$digest" >> "$GITHUB_STEP_SUMMARY"
            elif [[ "$MODE" == existing ]]; then
              echo "Missing existing image: $service:$tag" >&2; exit 1
            else
              echo "Build missing $service:$tag" >> "$GITHUB_STEP_SUMMARY"
            fi
          done < <(jq -r '.[]' <<< "$services")

  build-web:
    name: Build web image
    needs: [source, resolve-images]
    if: >-
      !cancelled() && needs.resolve-images.result == 'success' && needs.resolve-images.outputs.web_digest == ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build.yml
    with:
      service: web
      environment: ${{ inputs.environment || 'development' }}
      source_commit: ${{ needs.source.outputs.sha }}
      version: ${{ needs.source.outputs.version }}
      no_cache: ${{ inputs.no_cache || false }}
    secrets: inherit

  build-cms:
    name: Build CMS image
    needs: [source, resolve-images]
    if: >-
      !cancelled() && needs.resolve-images.result == 'success' && inputs.environment == 'production' && needs.resolve-images.outputs.cms_digest == ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build.yml
    with:
      service: cms
      environment: production
      source_commit: ${{ needs.source.outputs.sha }}
      version: ${{ needs.source.outputs.version }}
      no_cache: ${{ inputs.no_cache || false }}
    secrets: inherit

  host-sync:
    name: Sync host
    needs: source
    permissions:
      contents: read
    uses: ./.github/workflows/host-sync.yml
    with:
      ref: ${{ needs.source.outputs.sha }}
    secrets: inherit

  deploy:
    name: Deploy release
    needs: [source, host-sync, resolve-images, build-web, build-cms]
    if: >-
      !cancelled() && needs.resolve-images.result == 'success' &&
      (needs.build-web.result == 'success' || needs.resolve-images.outputs.web_digest != '') &&
      (inputs.environment != 'production' || needs.build-cms.result == 'success' || needs.resolve-images.outputs.cms_digest != '')
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: ${{ inputs.environment || 'development' }}
      source_commit: ${{ needs.source.outputs.sha }}
      version: ${{ needs.source.outputs.version }}
      operation: ${{ inputs.operation || 'deploy' }}
      web_digest: ${{ needs.resolve-images.outputs.web_digest || needs.build-web.outputs.image_digest }}
      cms_digest: ${{ needs.resolve-images.outputs.cms_digest || needs.build-cms.outputs.image_digest }}
    secrets: inherit

  release:
    name: Tag and publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    needs:
      - source
      - deploy
    if: ${{ !cancelled() && needs.deploy.result == 'success' && inputs.environment == 'production' && inputs.operation == 'deploy' }}
    steps:
      - name: Checkout controller with history and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.source.outputs.version }}
          SOURCE_COMMIT: ${{ needs.source.outputs.sha }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if tagged=$(git rev-parse -q --verify "refs/tags/$tag^{commit}"); then
            [[ "$tagged" == "$SOURCE_COMMIT" ]] || { echo "::error::$tag already tags $tagged, not $SOURCE_COMMIT"; exit 1; }
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::$tag is already released"
            exit 0
          fi
          python3 deployment/release-notes.py "$VERSION" "$SOURCE_COMMIT" >"$RUNNER_TEMP/release-notes.md"
          gh release create "$tag" --target "$SOURCE_COMMIT" --title "$tag" --notes-file "$RUNNER_TEMP/release-notes.md" --latest
          echo "GitHub Release: \`$tag\`" >>"$GITHUB_STEP_SUMMARY"
