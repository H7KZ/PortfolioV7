name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Whole environment to deploy (production includes web and CMS)
        type: choice
        options: [production, development]
        default: development

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validate branch and toolkit pin
        env:
          TARGET: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          [[ "$TARGET" == development || "$GITHUB_REF" == refs/heads/main ]] || {
            echo 'Production releases require main.' >&2; exit 1;
          }
          bash deployment/verify-toolkit-pin.sh
  build-web:
    needs: preflight
    uses: ./.github/workflows/_build-service.yml
    with:
      service: web
      cache_scope: web-${{ inputs.environment }}
    secrets: inherit
  build-cms:
    needs: preflight
    if: inputs.environment == 'production'
    uses: ./.github/workflows/_build-service.yml
    with:
      service: cms
      cache_scope: cms-production
    secrets: inherit
  deploy:
    needs: [build-web, build-cms]
    if: >-
      always() && needs.build-web.result == 'success' &&
      (needs.build-cms.result == 'success' ||
      (inputs.environment == 'development' && needs.build-cms.result == 'skipped'))
    uses: ./.github/workflows/_deploy-environment.yml
    with:
      environment: ${{ inputs.environment }}
      web_digest: ${{ needs.build-web.outputs.image_digest }}
      cms_digest: ${{ needs.build-cms.outputs.image_digest }}
    secrets: inherit
