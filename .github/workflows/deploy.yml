name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Whole environment to deploy (production includes web and CMS)
        type: choice
        options: [production, development]
        default: development
      reuse_images:
        description: 'Development only: skip rebuilding the web image if it already exists in ghcr for this commit.'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ inputs.environment || 'development' }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Code
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml
  validate:
    name: Validate Inputs
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      web_digest: ${{ steps.reuse.outputs.web_digest }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate branch and toolkit pin
        id: target
        env:
          TARGET: ${{ inputs.environment || 'development' }}
        run: |
          set -euo pipefail
          case "$TARGET" in production|development) ;; *) exit 1 ;; esac
          [[ "$TARGET" == development || "$GITHUB_REF" == refs/heads/main ]] || {
            echo 'Production releases require main.' >&2; exit 1;
          }
          bash deployment/verify-toolkit-pin.sh
          echo "environment=$TARGET" >> "$GITHUB_OUTPUT"
      - name: Resolve reusable web image digest from ghcr
        id: reuse
        if: inputs.reuse_images
        env:
          TARGET: ${{ inputs.environment || 'development' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          [[ "$TARGET" == development ]] || { echo 'Production builds cannot reuse images.' >&2; exit 1; }
          prefix="$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin >/dev/null
          digest="$(docker buildx imagetools inspect "ghcr.io/$prefix/web:$GITHUB_SHA" --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest // empty' || true)"
          if [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "web: reusing ghcr.io/$prefix/web:$GITHUB_SHA ($digest)"
            echo "web_digest=$digest" >> "$GITHUB_OUTPUT"
          else
            echo "web: no image tagged $GITHUB_SHA; it will be built"
          fi
  build-web:
    name: Build Web
    needs: validate
    if: needs.validate.outputs.web_digest == ''
    uses: ./.github/workflows/_build-service.yml
    with:
      service: web
      cache_scope: web-${{ needs.validate.outputs.environment }}
    secrets: inherit
  build-cms:
    name: Build CMS
    needs: validate
    if: needs.validate.outputs.environment == 'production'
    uses: ./.github/workflows/_build-service.yml
    with:
      service: cms
      cache_scope: cms-production
    secrets: inherit
  deploy:
    name: Deploy complete environment snapshot
    needs: [validate, build-web, build-cms]
    if: >-
      !cancelled() && needs.validate.result == 'success' && (needs.build-web.result == 'success' || needs.validate.outputs.web_digest != '') &&
      (needs.build-cms.result == 'success' ||
      (needs.validate.outputs.environment == 'development' && needs.build-cms.result == 'skipped'))
    uses: ./.github/workflows/_deploy-service.yml
    with:
      environment: ${{ needs.validate.outputs.environment }}
      web_digest: ${{ needs.validate.outputs.web_digest || needs.build-web.outputs.image_digest }}
      cms_digest: ${{ needs.build-cms.outputs.image_digest }}
    secrets: inherit
