name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Whole environment to deploy (production includes web and CMS)
        type: choice
        options: [production, development]
        default: development

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ inputs.environment || 'development' }}
  cancel-in-progress: false

jobs:
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml
  preflight:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      environment: ${{ steps.target.outputs.environment }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate branch and toolkit pin
        id: target
        env:
          TARGET: ${{ inputs.environment || 'development' }}
        run: |
          set -euo pipefail
          case "$TARGET" in production|development) ;; *) exit 1 ;; esac
          [[ "$TARGET" == development || "$GITHUB_REF" == refs/heads/main ]] || {
            echo 'Production releases require main.' >&2; exit 1;
          }
          bash deployment/verify-toolkit-pin.sh
          echo "environment=$TARGET" >> "$GITHUB_OUTPUT"
  build-web:
    needs: preflight
    uses: ./.github/workflows/_build-service.yml
    with:
      service: web
      cache_scope: web-${{ needs.preflight.outputs.environment }}
    secrets: inherit
  build-cms:
    needs: preflight
    if: needs.preflight.outputs.environment == 'production'
    uses: ./.github/workflows/_build-service.yml
    with:
      service: cms
      cache_scope: cms-production
    secrets: inherit
  deploy:
    needs: [preflight, build-web, build-cms]
    if: >-
      !cancelled() && needs.preflight.result == 'success' && needs.build-web.result == 'success' &&
      (needs.build-cms.result == 'success' ||
      (needs.preflight.outputs.environment == 'development' && needs.build-cms.result == 'skipped'))
    uses: ./.github/workflows/_deploy-environment.yml
    with:
      environment: ${{ needs.preflight.outputs.environment }}
      web_digest: ${{ needs.build-web.outputs.image_digest }}
      cms_digest: ${{ needs.build-cms.outputs.image_digest }}
    secrets: inherit
