# ==============================================================================
# Workflow: Deploy Analytics
# Description: Versioned deploy of the portfolio-umami analytics stack:
#              ~/portfolio/versions/analytics/<sha>/, then `current` is
#              repointed. Manual dispatch only, like the app deploy.
#
# Required Secrets (repository-level):
#   SSH_HOST, SSH_USER, SSH_PORT, SSH_PRIVATE_KEY
#   UMAMI_DB_NAME, UMAMI_DB_USER, UMAMI_DB_PASSWORD, UMAMI_APP_SECRET
#
# Required Vars (repository-level):
#   SITE_DOMAIN, UMAMI_DOMAIN
# ==============================================================================

name: Deploy Analytics

on:
  workflow_dispatch:

concurrency:
  group: deploy-analytics
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Analytics
    runs-on: self-hosted
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version tag
        id: version
        run: echo "tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Create version directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: mkdir -p "$HOME/portfolio/versions/analytics/${{ steps.version.outputs.tag }}"

      - name: Upload deployment files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: 'deployment/'
          target: '~/portfolio/versions/analytics/${{ steps.version.outputs.tag }}'
          strip_components: 1
          overwrite: true

      - name: Deploy
        uses: appleboy/ssh-action@v1
        env:
          VERSION_TAG: ${{ steps.version.outputs.tag }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          UMAMI_DOMAIN: ${{ vars.UMAMI_DOMAIN }}
          UMAMI_DB_NAME: ${{ secrets.UMAMI_DB_NAME }}
          UMAMI_DB_USER: ${{ secrets.UMAMI_DB_USER }}
          UMAMI_DB_PASSWORD: ${{ secrets.UMAMI_DB_PASSWORD }}
          UMAMI_APP_SECRET: ${{ secrets.UMAMI_APP_SECRET }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: VERSION_TAG,SITE_DOMAIN,UMAMI_DOMAIN,UMAMI_DB_NAME,UMAMI_DB_USER,UMAMI_DB_PASSWORD,UMAMI_APP_SECRET
          command_timeout: 15m
          script: |
            set -euo pipefail
            VERSION_DIR="$HOME/portfolio/versions/analytics/$VERSION_TAG"
            bash "$VERSION_DIR/analytics/deploy.sh"
            ln -sfn "$VERSION_DIR" "$HOME/portfolio/versions/analytics/current"
            echo "Analytics deploy complete: $VERSION_TAG"
