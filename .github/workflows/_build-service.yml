# ==============================================================================
# Workflow: Build Service (reusable)
# Description: Builds and pushes a single service Docker image to GHCR.
#              Dockerfiles live under apps/<service>/ in this pnpm/turbo
#              monorepo; build context is the repo root. Called by
#              deploy.yml. Runs on a GitHub-hosted runner
#              (ubuntu-latest). GHCR push uses GITHUB_TOKEN, so this needs no
#              extra secrets.
#
# Inputs:  service (web | cms), cache_scope
# Outputs: full commit tag, image prefix and pushed image digest.
# ==============================================================================

name: Build Service (reusable)

on:
  workflow_call:
    inputs:
      service:
        description: 'Service to build: web | cms'
        required: true
        type: string
      cache_scope:
        description: 'GHA cache scope (e.g. web-prod)'
        required: true
        type: string
    outputs:
      image_digest:
        description: 'Immutable digest returned by Buildx'
        value: ${{ jobs.build.outputs.image_digest }}
      image_tag:
        description: 'Full commit used as the versioned image tag'
        value: ${{ jobs.build.outputs.image_tag }}
      image_prefix:
        description: 'Registry path prefix without registry host (e.g. h7kz/portfoliov7)'
        value: ${{ jobs.build.outputs.image_prefix }}

jobs:
  build:
    name: Build and Push ${{ inputs.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_prefix: ${{ steps.meta.outputs.image_prefix }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Extract Metadata
        id: meta
        run: |
          TAG="$GITHUB_SHA"
          PREFIX="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image_prefix=${PREFIX}" >> "$GITHUB_OUTPUT"
          echo "::notice::Building ${{ inputs.service }} image with tag: ${TAG}"
          echo "::notice::Image prefix: ${PREFIX}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/${{ inputs.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.image_prefix }}/${{ inputs.service }}:${{ steps.meta.outputs.image_tag }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.image_tag }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ inputs.cache_scope }}
          platforms: linux/amd64

      - name: Summarize image digest
        env:
          SERVICE: ${{ inputs.service }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "${SERVICE} image_digest=${DIGEST}" >> "$GITHUB_STEP_SUMMARY"

      - name: Log out of GitHub Container Registry
        if: always()
        run: docker logout ghcr.io
