# ==============================================================================
# Workflow: Build Service (reusable)
# Description: Builds and pushes a single service Docker image to GHCR.
#              Dockerfiles live under apps/<service>/ in this pnpm/turbo
#              monorepo; build context is the repo root. Called by
#              deploy.yml. Runs on a GitHub-hosted runner
#              (ubuntu-latest). GHCR push uses GITHUB_TOKEN, so this needs no
#              extra secrets.
#
# Inputs: service (web | cms), environment, source_commit, version, no_cache
# Outputs: full commit tag, image prefix and pushed image digest.
# ==============================================================================

name: Build Service (reusable)

on:
  workflow_call:
    inputs:
      service:
        description: 'Service to build: web | cms'
        required: true
        type: string
      environment:
        description: Target environment the image is built for (production or development)
        required: true
        type: string
      source_commit:
        description: Full SHA of the source to build
        required: true
        type: string
      version:
        description: Release version YYYY.MM.DD-<run number> (extra image tag, APP_VERSION, OCI label)
        required: true
        type: string
      no_cache:
        description: Build without the Docker layer cache
        required: false
        type: boolean
        default: false
    outputs:
      image_digest:
        description: 'Immutable digest returned by Buildx'
        value: ${{ jobs.build.outputs.image_digest }}
      image_tag:
        description: 'Environment and full commit used as the versioned image tag'
        value: ${{ jobs.build.outputs.image_tag }}
      image_prefix:
        description: 'Registry path prefix without registry host (e.g. h7kz/portfoliov7)'
        value: ${{ jobs.build.outputs.image_prefix }}

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.service }} image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_prefix: ${{ steps.meta.outputs.image_prefix }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit }}

      - name: Extract metadata
        id: meta
        env:
          SOURCE_SHA: ${{ inputs.source_commit }}
          TARGET: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          case "$TARGET" in production|development) ;; *) exit 1 ;; esac
          TAG="$TARGET-$SOURCE_SHA"
          PREFIX="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image_prefix=${PREFIX}" >> "$GITHUB_OUTPUT"
          echo "::notice::Building ${{ inputs.service }} image with tag: ${TAG}"
          echo "::notice::Image prefix: ${PREFIX}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./apps/${{ inputs.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.image_prefix }}/${{ inputs.service }}:${{ steps.meta.outputs.image_tag }}
            ghcr.io/${{ steps.meta.outputs.image_prefix }}/${{ inputs.service }}:${{ inputs.version }}
          build-args: |
            APP_VERSION=${{ inputs.version }}
            GIT_SHA=${{ inputs.source_commit }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.source_commit }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          no-cache: ${{ inputs.no_cache }}
          cache-from: type=gha,scope=${{ inputs.service }}-${{ inputs.environment }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}-${{ inputs.environment }}
          platforms: linux/amd64

      - name: Summarize image digest
        env:
          SERVICE: ${{ inputs.service }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "${SERVICE} image_digest=${DIGEST}" >> "$GITHUB_STEP_SUMMARY"

      - name: Log out of GitHub Container Registry
        if: always()
        run: docker logout ghcr.io
