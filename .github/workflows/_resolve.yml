# Resolves a branch, tag or SHA to one full commit SHA, so every job of a run uses the same source.

name: Resolve Source (reusable)

on:
  workflow_call:
    inputs:
      ref:
        description: Source branch, tag or SHA; blank = workflow ref
        required: false
        type: string
        default: ''
    outputs:
      sha:
        description: Full commit SHA of the resolved source
        value: ${{ jobs.source.outputs.sha }}
      version:
        description: Release version YYYY.MM.DD-<run number> (image tag, APP_VERSION, release ID)
        value: ${{ jobs.source.outputs.version }}

permissions:
  contents: read

jobs:
  runner:
    name: Pick runner
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      labels: ${{ steps.pick.outputs.labels }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ secrets.RUNNER_TOKEN }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork == true }}
        run: |
          # self-hosted if an idle runner is online (and not a fork PR), else GitHub-hosted
          labels='["ubuntu-latest"]'
          if [ -n "$GH_TOKEN" ] && [ "$IS_FORK" != "true" ]; then
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runners?per_page=100"               --jq '[.runners[] | select(.status == "online" and .busy == false and ([.labels[].name] | index("self-hosted")))] | length' 2>/dev/null || echo 0)
            if [ "${n:-0}" -gt 0 ]; then
              labels='["self-hosted","Linux","X64","hetzner"]'
            fi
          fi
          echo "labels=$labels" >> "$GITHUB_OUTPUT"
          echo "Runner: $labels"

  source:
    name: Resolve source
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Resolve source commit
        id: source
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          version="$(date -u +%Y.%m.%d)-$GITHUB_RUN_NUMBER"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Source: $sha, version $version" >> "$GITHUB_STEP_SUMMARY"
