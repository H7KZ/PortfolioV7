# ==============================================================================
# Workflow: Deploy Service (reusable)
# Description: Deploys a single service to the VPS via deployment/deploy.sh.
#              Version base is $HOME/portfolio/versions; .env carries only this
#              service's app config. Called by deploy.yml/rollback.yml.
#
# Inputs:  service, image_tag, image_prefix, environment, project_name
#
# `environment` selects the deploy target directory (deployment/<environment>/)
# AND the GitHub Environment that scopes secrets/vars (POSTGRES_*, PAYLOAD_SECRET,
# etc. differ per target - see repo Settings > Environments). Must be
# 'production' or 'development'; those are the only deployment/<env>/ dirs that
# exist.
#
# `project_name` is the Docker Compose project name (-p) passed to deploy.sh. It
# MUST differ between production and development ('portfolio' / 'portfolio-dev')
# - compose disambiguates containers by project name, so deploying with the same
# project name for both environments would make a development deploy recreate
# production's containers (and vice versa). Callers compute this per
# environment; there is no default.
#
# The CMS (Payload/Next) exists ONLY in production. A development deploy still
# calls this workflow for the `web` service only; callers never route `cms` to
# environment: development. CMS_DOMAIN is therefore only required when
# environment is production.
#
# `vars.PROJECT` (a GitHub Environment variable, NOT a workflow input - read
# below alongside DOMAIN) is written into .env as PROJECT and consumed by
# deploy.sh/compose the same way DOMAIN is. Set it once per GitHub Environment
# (Settings -> Environments -> production/development -> Variables).

name: Deploy Service (reusable)

on:
  workflow_call:
    inputs:
      service:
        description: 'Service to deploy: web | cms'
        required: true
        type: string
      image_tag:
        description: 'Image tag (short SHA from build step)'
        required: true
        type: string
      image_prefix:
        description: 'Registry path prefix (e.g. h7kz/portfoliov7)'
        required: true
        type: string
      environment:
        description: 'Deploy target: production | development'
        required: false
        type: string
        default: production
      project_name:
        description: 'Docker Compose project name (e.g. portfolio | portfolio-dev) - must be unique per environment'
        required: true
        type: string

jobs:
  deploy:
    name: Deploy ${{ inputs.service }} (${{ inputs.environment }})
    runs-on: self-hosted
    timeout-minutes: 15
    environment: ${{ inputs.environment }}

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create Version Directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            mkdir -p "$HOME/portfolio/versions/${{ inputs.environment }}/${{ inputs.image_tag }}"

      - name: Upload Deployment Files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: 'deployment/'
          target: '~/portfolio/versions/${{ inputs.environment }}/${{ inputs.image_tag }}'
          strip_components: 1
          overwrite: true

      - name: Deploy Service
        uses: appleboy/ssh-action@v1
        env:
          # Auth
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          # Image
          IMG_REGISTRY: ghcr.io
          IMG_PREFIX: ${{ inputs.image_prefix }}
          IMG_TAG: ${{ inputs.image_tag }}
          # Service / target
          APP_SERVICE: ${{ inputs.service }}
          APP_ENVIRONMENT: ${{ inputs.environment }}
          APP_PROJECT_NAME: ${{ inputs.project_name }}
          # Non-sensitive (GitHub Variables, scoped by the job's `environment:`)
          APP_PROJECT: ${{ vars.PROJECT }}
          APP_DOMAIN: ${{ vars.DOMAIN }}
          APP_CMS_DOMAIN: ${{ vars.CMS_DOMAIN }}
          APP_UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
          # Sensitive (GitHub Secrets, scoped by the job's `environment:`)
          APP_POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          APP_POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          APP_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APP_PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          APP_PREVIEW_SECRET: ${{ secrets.PREVIEW_SECRET }}
          APP_REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          APP_CMS_READ_API_KEY: ${{ secrets.CMS_READ_API_KEY }}
          APP_CMS_CONTACT_API_KEY: ${{ secrets.CMS_CONTACT_API_KEY }}
          APP_DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: GH_TOKEN,GH_ACTOR,IMG_REGISTRY,IMG_PREFIX,IMG_TAG,APP_SERVICE,APP_ENVIRONMENT,APP_PROJECT_NAME,APP_PROJECT,APP_DOMAIN,APP_CMS_DOMAIN,APP_UMAMI_WEBSITE_ID,APP_POSTGRES_DB,APP_POSTGRES_USER,APP_POSTGRES_PASSWORD,APP_PAYLOAD_SECRET,APP_PREVIEW_SECRET,APP_REVALIDATE_SECRET,APP_CMS_READ_API_KEY,APP_CMS_CONTACT_API_KEY,APP_DISCORD_WEBHOOK_URL
          script: |
            set -euo pipefail

            VERSION_DIR="$HOME/portfolio/versions/$APP_ENVIRONMENT/$IMG_TAG"
            CURRENT_LINK="$HOME/portfolio/versions/$APP_ENVIRONMENT/current"

            echo "=========================================="
            echo "Service Deploy: $APP_SERVICE @ $IMG_TAG -> $APP_ENVIRONMENT"
            echo "=========================================="

            # Login to GHCR
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
            trap 'docker logout ghcr.io' EXIT

            # A '$' or backtick in a secret CANNOT be carried by this .env file, so
            # refuse to deploy with one rather than deploy a quietly different value.
            #
            # printf below stops the SHELL from expanding it, but that is only the
            # first of two readers: Compose then interpolates the file it is handed,
            # so `PW=abc$def` reaches the container as `PW=abc`. Silent truncation is
            # bad enough for most secrets; for POSTGRES_PASSWORD it is unrecoverable,
            # because the database initialises with the truncated value on first boot
            # and the real password then differs from the stored secret forever.
            #
            # Generate secrets with `openssl rand -base64 32` - base64's alphabet has
            # no '$' or backtick, so a generated value always passes this.
            reject_uncarryable() {
              case "$2" in
                *'$'*|*'`'*)
                  echo "ERROR: secret $1 contains a '\$' or a backtick."
                  echo "       Compose would interpolate it and the container would get a TRUNCATED value."
                  echo "       Regenerate it with: openssl rand -base64 32"
                  exit 1
                  ;;
              esac
            }
            reject_uncarryable POSTGRES_DB "$APP_POSTGRES_DB"
            reject_uncarryable POSTGRES_USER "$APP_POSTGRES_USER"
            reject_uncarryable POSTGRES_PASSWORD "$APP_POSTGRES_PASSWORD"
            reject_uncarryable PAYLOAD_SECRET "$APP_PAYLOAD_SECRET"
            reject_uncarryable PREVIEW_SECRET "$APP_PREVIEW_SECRET"
            reject_uncarryable REVALIDATE_SECRET "$APP_REVALIDATE_SECRET"
            reject_uncarryable CMS_READ_API_KEY "$APP_CMS_READ_API_KEY"
            reject_uncarryable CMS_CONTACT_API_KEY "$APP_CMS_CONTACT_API_KEY"
            reject_uncarryable DISCORD_WEBHOOK_URL "$APP_DISCORD_WEBHOOK_URL"

            if [[ -z "$APP_PROJECT" ]]; then
              echo "ERROR: vars.PROJECT is not set on the '$APP_ENVIRONMENT' GitHub Environment."
              echo "       Set it under Settings > Environments > $APP_ENVIRONMENT > Variables."
              exit 1
            fi
            if [[ -z "$APP_DOMAIN" ]]; then
              echo "ERROR: vars.DOMAIN is not set on the '$APP_ENVIRONMENT' GitHub Environment."
              echo "       Set it under Settings > Environments > $APP_ENVIRONMENT > Variables."
              exit 1
            fi

            # The CMS exists only in production - require its domain there, and there
            # only, so a development environment is never made to depend on it.
            if [[ "$APP_ENVIRONMENT" == "production" && -z "$APP_CMS_DOMAIN" ]]; then
              echo "ERROR: vars.CMS_DOMAIN is not set on the 'production' GitHub Environment."
              exit 1
            fi

            # Required secrets differ per environment - the CMS-only-in-production
            # split means development never needs POSTGRES_*, PAYLOAD_SECRET or
            # CMS_CONTACT_API_KEY; DISCORD_WEBHOOK_URL is always optional.
            case "$APP_ENVIRONMENT" in
              production)
                for pair in "POSTGRES_DB:$APP_POSTGRES_DB" "POSTGRES_USER:$APP_POSTGRES_USER" \
                            "POSTGRES_PASSWORD:$APP_POSTGRES_PASSWORD" "PAYLOAD_SECRET:$APP_PAYLOAD_SECRET" \
                            "PREVIEW_SECRET:$APP_PREVIEW_SECRET" "REVALIDATE_SECRET:$APP_REVALIDATE_SECRET" \
                            "CMS_READ_API_KEY:$APP_CMS_READ_API_KEY" "CMS_CONTACT_API_KEY:$APP_CMS_CONTACT_API_KEY"; do
                  name="${pair%%:*}"
                  value="${pair#*:}"
                  if [[ -z "$value" ]]; then
                    echo "ERROR: secrets.$name is not set on the 'production' GitHub Environment."
                    exit 1
                  fi
                done
                ;;
              development)
                for pair in "PREVIEW_SECRET:$APP_PREVIEW_SECRET" "REVALIDATE_SECRET:$APP_REVALIDATE_SECRET" \
                            "CMS_READ_API_KEY:$APP_CMS_READ_API_KEY"; do
                  name="${pair%%:*}"
                  value="${pair#*:}"
                  if [[ -z "$value" ]]; then
                    echo "ERROR: secrets.$name is not set on the 'development' GitHub Environment."
                    exit 1
                  fi
                done
                ;;
              *)
                echo "ERROR: Unknown environment '$APP_ENVIRONMENT'. Valid: production, development"
                exit 1
                ;;
            esac

            # Write <environment>/.env - printf keeps the shell from expanding values.
            {
              printf 'PROJECT=%s\n' "$APP_PROJECT"
              printf 'DOMAIN=%s\n' "$APP_DOMAIN"
              printf 'CMS_DOMAIN=%s\n' "${APP_CMS_DOMAIN:-}"
              printf 'UMAMI_WEBSITE_ID=%s\n' "${APP_UMAMI_WEBSITE_ID:-}"
              printf 'POSTGRES_DB=%s\n' "${APP_POSTGRES_DB:-}"
              printf 'POSTGRES_USER=%s\n' "${APP_POSTGRES_USER:-}"
              printf 'POSTGRES_PASSWORD=%s\n' "${APP_POSTGRES_PASSWORD:-}"
              printf 'PAYLOAD_SECRET=%s\n' "${APP_PAYLOAD_SECRET:-}"
              printf 'PREVIEW_SECRET=%s\n' "${APP_PREVIEW_SECRET:-}"
              printf 'REVALIDATE_SECRET=%s\n' "${APP_REVALIDATE_SECRET:-}"
              printf 'CMS_READ_API_KEY=%s\n' "${APP_CMS_READ_API_KEY:-}"
              printf 'CMS_CONTACT_API_KEY=%s\n' "${APP_CMS_CONTACT_API_KEY:-}"
              printf 'DISCORD_WEBHOOK_URL=%s\n' "${APP_DISCORD_WEBHOOK_URL:-}"
            } > "$VERSION_DIR/$APP_ENVIRONMENT/.env"
            chmod 600 "$VERSION_DIR/$APP_ENVIRONMENT/.env"

            # Pass tag as env var (not via a shared file - avoids a write race when
            # both services deploy simultaneously). Derive the tag var from the service.
            case "$APP_SERVICE" in
              web) SERVICE_TAG_VAR="WEB_IMAGE_TAG" ;;
              cms) SERVICE_TAG_VAR="CMS_IMAGE_TAG" ;;
              *)   echo "Unknown service: '$APP_SERVICE'. Valid: web, cms"; exit 1 ;;
            esac

            cd "$VERSION_DIR"
            export "${SERVICE_TAG_VAR}=${IMG_TAG}"
            IMAGE_REGISTRY="ghcr.io" \
              IMAGE_PREFIX="$IMG_PREFIX" \
              bash ./deploy.sh "$APP_PROJECT_NAME" "$APP_ENVIRONMENT" "$APP_SERVICE"

            ln -sfn "$VERSION_DIR" "$CURRENT_LINK"

            echo "=========================================="
            echo "Service deploy complete: $APP_SERVICE ($APP_ENVIRONMENT)"
            echo "=========================================="
