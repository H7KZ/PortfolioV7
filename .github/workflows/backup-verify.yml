# ==============================================================================
# Workflow: Backup Verify
# Description: Off-VPS proof that backups exist and restore, using a read-only B2 key.
#              The freshness check runs daily, the restore drill weekly; each pings its
#              own Healthchecks check, so a workflow that never runs also alerts.
#              Setup: deployment/backup/README.md
# Trigger: schedule, manual
# ==============================================================================

name: Backup Verify
run-name: "Backup Verify · ${{ inputs.operation || 'scheduled' }} · ${{ inputs.ref || github.ref_name }}"

on:
  schedule:
    - cron: '45 6 * * *'
    - cron: '20 7 * * 1'
  workflow_dispatch:
    inputs:
      ref:
        description: Source branch, tag or SHA; blank = workflow ref
        type: string
        default: ''
      operation:
        description: Which verification to run
        type: choice
        options: [check, drill, both]
        default: both

permissions:
  contents: read

env:
  TOOLKIT_DIRECT: '1'
  BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
  BACKUP_B2_KEY_ID: ${{ secrets.BACKUP_B2_READER_KEY_ID }}
  BACKUP_B2_KEY: ${{ secrets.BACKUP_B2_READER_KEY }}

jobs:
  source:
    name: Resolve source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Resolve source commit
        id: source
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  check:
    name: Check freshness
    needs: source
    if: (github.event_name == 'schedule' && github.event.schedule == '45 6 * * *') || (github.event_name == 'workflow_dispatch' && inputs.operation != 'drill')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
      - name: Verify toolkit pin
        run: bash deployment/toolkit verify
      - name: Install backup tools
        run: sudo TOOLKIT_DIRECT=1 bash deployment/toolkit backup install-tools
      - name: Check newest object per component
        env:
          BACKUP_HC_FRESHNESS_URL: ${{ secrets.BACKUP_HC_FRESHNESS_URL }}
        run: bash deployment/toolkit backup check

  drill:
    name: Restore drill
    needs: source
    if: (github.event_name == 'schedule' && github.event.schedule == '20 7 * * 1') || (github.event_name == 'workflow_dispatch' && inputs.operation != 'check')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
      - name: Verify toolkit pin
        run: bash deployment/toolkit verify
      - name: Install backup tools
        run: sudo TOOLKIT_DIRECT=1 bash deployment/toolkit backup install-tools
      - name: Restore every component into throwaway containers
        env:
          BACKUP_HC_DRILL_URL: ${{ secrets.BACKUP_HC_DRILL_URL }}
          AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
        run: |
          set -euo pipefail
          identity="$RUNNER_TEMP/age-identity.txt"
          install -m 0600 /dev/null "$identity"
          printf '%s\n' "$AGE_IDENTITY" > "$identity"
          trap 'rm -f -- "$identity"' EXIT
          export BACKUP_AGE_IDENTITY="$identity"
          bash deployment/toolkit backup drill
